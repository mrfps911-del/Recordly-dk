name: Build Linux ARM64

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libx11-dev libxt-dev libxtst-dev libxkbfile-dev libxi-dev libxrandr-dev libxinerama-dev
          npm ci --ignore-scripts
          node node_modules/ffmpeg-static/install.js
          rm -rf node_modules/uiohook-napi/build
          npx electron-builder install-app-deps --arch=arm64

      - name: Build app
        run: |
          npm run build:platform-native-helpers
          npx tsc
          npx vite build --config vite.config.ts
          npm run normalize:electron-main-cjs
          npx electron-builder --linux AppImage --arm64 --publish never --config.linux.artifactName='Recordly-linux-arm64.${ext}'

      - uses: actions/upload-artifact@v4
        with:
          name: Recordly-linux-arm64
          path: release/Recordly-linux-arm64.AppImage
